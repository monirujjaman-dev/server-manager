name: Release

# Push a tag vX.Y.Z on main to publish packages, smctl binaries, the install script and a
# signed checksums.txt as a GitHub release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  GO_VERSION: "1.27.4"
  GOTOOLCHAIN: local

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the release
      id-token: write   # keyless signing with the workflow's OIDC identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build packages
        run: make packages
      - name: Check the package version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test -f "dist/sm-agent_${TAG#v}_linux_amd64.deb" || { echo "packages do not carry version ${TAG#v}"; ls dist; exit 1; }
      - name: Sign checksums.txt
        # The install script verifies this bundle against this workflow's identity:
        # https://github.com/<repo>/.github/workflows/release.yml@refs/tags/<tag>
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG"
