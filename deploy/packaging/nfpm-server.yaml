# nfpm configuration for the control-plane package (built by `make packages`).
name: sm-server
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: Server Manager maintainers
description: |
  Server Manager control plane. Needs PostgreSQL; see
  /etc/sm-server/sm-server.yaml.example to configure it.
homepage: https://github.com/monirujjaman-dev/server-manager
license: Proprietary
contents:
  - src: ${BIN_DIR}/sm-server
    dst: /usr/bin/sm-server
    file_info: { mode: 0755 }
  - src: deploy/systemd/sm-server.service
    dst: /usr/lib/systemd/system/sm-server.service
    file_info: { mode: 0644 }
  - src: deploy/packaging/sm-server.yaml.example
    dst: /etc/sm-server/sm-server.yaml.example
    type: config|noreplace
    file_info: { mode: 0644 }
scripts:
  preinstall: deploy/packaging/scripts/server-preinstall.sh
  postinstall: deploy/packaging/scripts/server-postinstall.sh
  preremove: deploy/packaging/scripts/server-preremove.sh
  postremove: deploy/packaging/scripts/postremove.sh
overrides:
  deb:
    depends: [systemd, adduser | passwd]
  rpm:
    depends: [systemd, shadow-utils]
