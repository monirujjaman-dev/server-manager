# nfpm configuration for the agent package (built by `make packages`).
name: sm-agent
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: Server Manager maintainers
description: |
  Server Manager agent and privileged helper. Connects out to the control plane over
  mutual TLS; enroll with `sm-agent enroll` (or the install script) to start it.
homepage: https://github.com/monirujjaman-dev/server-manager
license: Proprietary
contents:
  - src: ${BIN_DIR}/sm-agent
    dst: /usr/bin/sm-agent
    file_info: { mode: 0755 }
  - src: deploy/systemd/sm-agent.service
    dst: /usr/lib/systemd/system/sm-agent.service
    file_info: { mode: 0644 }
  - src: deploy/systemd/sm-agent-privd.service
    dst: /usr/lib/systemd/system/sm-agent-privd.service
    file_info: { mode: 0644 }
  # Swap: the privileged helper writes only in /var/lib/smswap; the unit and the sysctl
  # entry point there, so it needs no write access to /etc.
  - src: deploy/systemd/var-lib-smswap-swapfile.swap
    dst: /usr/lib/systemd/system/var-lib-smswap-swapfile.swap
    file_info: { mode: 0644 }
  - src: /var/lib/smswap/swappiness.conf
    dst: /etc/sysctl.d/90-sm-swappiness.conf
    type: symlink
scripts:
  preinstall: deploy/packaging/scripts/agent-preinstall.sh
  postinstall: deploy/packaging/scripts/agent-postinstall.sh
  preremove: deploy/packaging/scripts/agent-preremove.sh
  postremove: deploy/packaging/scripts/postremove.sh
overrides:
  deb:
    depends: [systemd, adduser | passwd]
  rpm:
    depends: [systemd, shadow-utils]
