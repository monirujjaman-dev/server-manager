syntax = "proto3";

package sm.agent.v1;

import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Command envelope
//
// The control plane serializes a CommandEnvelope, signs those exact bytes with its
// Ed25519 command key, and sends both in a Command. The agent and the privileged helper
// verify the signature over the bytes they received before decoding them, so no
// canonical encoding is needed.
// ---------------------------------------------------------------------------

message CommandEnvelope {
  // Job UUID. Also the replay-protection key.
  string id = 1;
  // Server UUID the command is for; must match the receiving agent's identity.
  string server_id = 2;
  google.protobuf.Timestamp issued_at = 3;
  // Commands are rejected after this time (short: about a minute after dispatch).
  google.protobuf.Timestamp expires_at = 4;
  // 16 random bytes.
  bytes nonce = 5;
  ActionRequest request = 6;
}

// Command is sent from the control plane to the agent.
message Command {
  // Serialized CommandEnvelope.
  bytes envelope = 1;
  // Ed25519 signature over envelope.
  bytes signature = 2;
}

// ActionRequest is one typed operation. There is deliberately no free-form command.
message ActionRequest {
  oneof action {
    SystemInfoRequest system_info = 1;
    ServiceListRequest service_list = 2;
    ServiceControlRequest service_control = 3;
    ProcessListRequest process_list = 4;
    ProcessSignalRequest process_signal = 5;
    LogQueryRequest log_query = 6;
    AuthLogRequest auth_log = 7;
    DockerContainerListRequest docker_container_list = 8;
    DockerContainerControlRequest docker_container_control = 9;
    DockerLogsRequest docker_logs = 10;
    DockerStatsRequest docker_stats = 11;
    DockerImageListRequest docker_image_list = 12;
    DockerVolumeListRequest docker_volume_list = 13;
    DockerNetworkListRequest docker_network_list = 14;
    DockerPruneRequest docker_prune = 15;
    TimeStatusRequest time_status = 16;
    TimeSetTimezoneRequest time_set_timezone = 17;
    TimeSetNTPRequest time_set_ntp = 18;
    SwapStatusRequest swap_status = 19;
    SwapConfigureRequest swap_configure = 20;
    SwapSetSwappinessRequest swap_set_swappiness = 21;
  }
}

// CommandResult is sent from the agent to the control plane.
message CommandResult {
  // Job UUID from the envelope.
  string id = 1;
  CommandStatus status = 2;
  // Human-readable error for FAILED and REJECTED.
  string error = 3;
  ActionResult result = 4;
}

enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  COMMAND_STATUS_SUCCEEDED = 1;
  // The action ran and failed.
  COMMAND_STATUS_FAILED = 2;
  // The command was not executed (bad signature, expired, replayed, invalid params).
  COMMAND_STATUS_REJECTED = 3;
}

message ActionResult {
  oneof result {
    SystemInfoResult system_info = 1;
    ServiceListResult service_list = 2;
    ServiceControlResult service_control = 3;
    ProcessListResult process_list = 4;
    ProcessSignalResult process_signal = 5;
    LogQueryResult log_query = 6;
    AuthLogResult auth_log = 7;
    DockerContainerListResult docker_container_list = 8;
    DockerContainerControlResult docker_container_control = 9;
    DockerLogsResult docker_logs = 10;
    DockerStatsResult docker_stats = 11;
    DockerImageListResult docker_image_list = 12;
    DockerVolumeListResult docker_volume_list = 13;
    DockerNetworkListResult docker_network_list = 14;
    DockerPruneResult docker_prune = 15;
    TimeStatusResult time_status = 16;
    TimeStatusResult time_set_timezone = 17;
    TimeStatusResult time_set_ntp = 18;
    SwapStatusResult swap_status = 19;
    SwapStatusResult swap_configure = 20;
    SwapStatusResult swap_set_swappiness = 21;
  }
}

// ---------------------------------------------------------------------------
// system.info (read)
// ---------------------------------------------------------------------------

message SystemInfoRequest {}

message SystemInfoResult {
  string hostname = 1;
  uint64 uptime_seconds = 2;
  uint32 cpu_count = 3;
  double load1 = 4;
  double load5 = 5;
  double load15 = 6;
  uint64 memory_total_bytes = 7;
  uint64 memory_available_bytes = 8;
  uint64 swap_total_bytes = 9;
  uint64 swap_free_bytes = 10;
  repeated Filesystem filesystems = 11;
}

message Filesystem {
  string mount_point = 1;
  string device = 2;
  string fs_type = 3;
  uint64 total_bytes = 4;
  uint64 available_bytes = 5;
  uint64 inodes_total = 6;
  uint64 inodes_free = 7;
}

// ---------------------------------------------------------------------------
// services.list (read) and service.control (privileged)
// ---------------------------------------------------------------------------

message ServiceListRequest {
  // Optional substring filter on the unit name.
  string filter = 1;
}

message ServiceListResult {
  repeated ServiceUnit units = 1;
}

message ServiceUnit {
  string name = 1;
  string description = 2;
  // e.g. "loaded", "not-found"
  string load_state = 3;
  // e.g. "active", "inactive", "failed"
  string active_state = 4;
  // e.g. "running", "exited", "dead"
  string sub_state = 5;
  // e.g. "enabled", "disabled", "static"
  string unit_file_state = 6;
}

enum ServiceOperation {
  SERVICE_OPERATION_UNSPECIFIED = 0;
  SERVICE_OPERATION_START = 1;
  SERVICE_OPERATION_STOP = 2;
  SERVICE_OPERATION_RESTART = 3;
  SERVICE_OPERATION_RELOAD = 4;
  SERVICE_OPERATION_ENABLE = 5;
  SERVICE_OPERATION_DISABLE = 6;
}

message ServiceControlRequest {
  // Unit name ending in .service, e.g. "nginx.service".
  string unit = 1;
  ServiceOperation operation = 2;
}

message ServiceControlResult {
  // Unit state after the operation.
  ServiceUnit unit = 1;
}

// ---------------------------------------------------------------------------
// processes.list (read) and process.signal (privileged)
// ---------------------------------------------------------------------------

enum ProcessSort {
  PROCESS_SORT_UNSPECIFIED = 0;
  PROCESS_SORT_CPU = 1;
  PROCESS_SORT_MEMORY = 2;
  PROCESS_SORT_PID = 3;
}

message ProcessListRequest {
  ProcessSort sort = 1;
  // Maximum number of processes; 0 means 50. Capped at 500.
  uint32 limit = 2;
}

message ProcessListResult {
  repeated Process processes = 1;
  uint32 total = 2;
}

message Process {
  int32 pid = 1;
  int32 ppid = 2;
  string user = 3;
  string name = 4;
  // Truncated to 512 bytes.
  string command_line = 5;
  string state = 6;
  double cpu_percent = 7;
  uint64 rss_bytes = 8;
  // Start time in clock ticks since boot; identifies the process across PID reuse.
  uint64 start_ticks = 9;
  uint32 threads = 10;
}

enum Signal {
  SIGNAL_UNSPECIFIED = 0;
  SIGNAL_TERM = 1;
  SIGNAL_KILL = 2;
  SIGNAL_HUP = 3;
  SIGNAL_INT = 4;
  SIGNAL_QUIT = 5;
  SIGNAL_USR1 = 6;
  SIGNAL_USR2 = 7;
}

message ProcessSignalRequest {
  int32 pid = 1;
  Signal signal = 2;
  // Optional: start_ticks from processes.list. When set, the signal is only sent if the
  // PID still belongs to the same process.
  uint64 start_ticks = 3;
}

message ProcessSignalResult {}

// ---------------------------------------------------------------------------
// logs.query and logs.auth (read; journald)
// ---------------------------------------------------------------------------

message LogQueryRequest {
  // Optional systemd unit, e.g. "nginx.service".
  string unit = 1;
  // Only entries newer than this many seconds; 0 means 1 hour. Ignored with after_cursor.
  uint32 since_seconds = 2;
  // Maximum entries, newest last; 0 means 100. Capped at 500.
  uint32 limit = 3;
  // Optional case-insensitive substring filter on the message.
  string grep = 4;
  // Only entries at this priority or more severe: 0 emerg ... 7 debug. Unset means all.
  optional uint32 max_priority = 5;
  // Continue after this journal cursor (from a previous result) to follow new entries.
  string after_cursor = 6;
}

message LogQueryResult {
  repeated LogEntry entries = 1;
  // Cursor of the last entry; pass it as after_cursor to get newer entries.
  string cursor = 2;
}

message LogEntry {
  google.protobuf.Timestamp time = 1;
  // syslog priority, 0 (emerg) to 7 (debug).
  uint32 priority = 2;
  string unit = 3;
  string identifier = 4;
  int32 pid = 5;
  // Truncated to 1024 bytes.
  string message = 6;
}

message AuthLogRequest {
  // 0 means 24 hours.
  uint32 since_seconds = 1;
  // 0 means 100. Capped at 500.
  uint32 limit = 2;
}

message AuthLogResult {
  repeated AuthEvent events = 1;
}

enum AuthEventKind {
  AUTH_EVENT_KIND_UNSPECIFIED = 0;
  AUTH_EVENT_KIND_SSH_ACCEPTED = 1;
  AUTH_EVENT_KIND_SSH_FAILED = 2;
  AUTH_EVENT_KIND_SSH_INVALID_USER = 3;
  AUTH_EVENT_KIND_SUDO = 4;
  AUTH_EVENT_KIND_SUDO_FAILED = 5;
}

message AuthEvent {
  google.protobuf.Timestamp time = 1;
  AuthEventKind kind = 2;
  string user = 3;
  string source_ip = 4;
  // SSH: "publickey", "password", ...
  string method = 5;
  // sudo: target user and command.
  string target_user = 6;
  string command = 7;
  string message = 8;
}

// ---------------------------------------------------------------------------
// docker.* (all privileged: the Docker socket is root-equivalent, so even read actions
// run in the helper, never in the unprivileged agent)
//
// A container reference is a container name or (a prefix of) its hex ID, matching
// ^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,127}$.
// ---------------------------------------------------------------------------

message DockerContainerListRequest {
  // Also list containers that are not running.
  bool all = 1;
}

message DockerContainerListResult {
  // At most 1000 containers.
  repeated DockerContainer containers = 1;
  bool truncated = 2;
}

message DockerContainer {
  // Full hex ID.
  string id = 1;
  // Primary name without the leading slash.
  string name = 2;
  string image = 3;
  // e.g. "running", "exited", "paused", "restarting", "created", "dead"
  string state = 4;
  // Human-readable status from Docker, e.g. "Up 3 hours (healthy)".
  string status = 5;
  google.protobuf.Timestamp created = 6;
  // At most 32 published ports.
  repeated DockerPort ports = 7;
}

message DockerPort {
  string ip = 1;
  uint32 private_port = 2;
  // 0 if not published.
  uint32 public_port = 3;
  // "tcp", "udp" or "sctp"
  string protocol = 4;
}

enum DockerContainerOperation {
  DOCKER_CONTAINER_OPERATION_UNSPECIFIED = 0;
  DOCKER_CONTAINER_OPERATION_START = 1;
  DOCKER_CONTAINER_OPERATION_STOP = 2;
  DOCKER_CONTAINER_OPERATION_RESTART = 3;
  DOCKER_CONTAINER_OPERATION_REMOVE = 4;
}

message DockerContainerControlRequest {
  // Container reference (see above).
  string container = 1;
  DockerContainerOperation operation = 2;
  // Stop and restart: seconds to wait before killing; 0 means Docker's default. Max 90.
  uint32 timeout_seconds = 3;
  // Remove only: also remove a running container (it is killed).
  bool force = 4;
  // Remove only: also remove the container's anonymous volumes (critical risk).
  bool remove_volumes = 5;
}

message DockerContainerControlResult {
  // Container state after the operation; for remove, the state before removal.
  DockerContainer container = 1;
}

message DockerLogsRequest {
  // Container reference (see above).
  string container = 1;
  // Number of most recent lines; 0 means 100. Capped at 500.
  uint32 tail = 2;
  // Only lines newer than this many seconds; 0 means no limit. Max 30 days.
  uint32 since_seconds = 3;
}

message DockerLogsResult {
  repeated DockerLogLine lines = 1;
}

message DockerLogLine {
  google.protobuf.Timestamp time = 1;
  // "stdout" or "stderr" ("stdout" for containers with a TTY).
  string stream = 2;
  // Truncated to 1024 bytes.
  string message = 3;
}

message DockerStatsRequest {
  // Optional container reference; empty means every running container (at most 100).
  string container = 1;
}

message DockerStatsResult {
  repeated DockerContainerStats stats = 1;
}

message DockerContainerStats {
  string id = 1;
  string name = 2;
  // Percent of one CPU, as `docker stats` shows it (may exceed 100 on several CPUs).
  double cpu_percent = 3;
  // Memory used excluding the page cache.
  uint64 memory_usage_bytes = 4;
  uint64 memory_limit_bytes = 5;
  uint64 net_rx_bytes = 6;
  uint64 net_tx_bytes = 7;
  uint64 block_read_bytes = 8;
  uint64 block_write_bytes = 9;
  uint32 pids = 10;
}

message DockerImageListRequest {}

message DockerImageListResult {
  // At most 1000 images.
  repeated DockerImage images = 1;
  bool truncated = 2;
}

message DockerImage {
  string id = 1;
  // At most 16 tags; empty for dangling images.
  repeated string tags = 2;
  uint64 size_bytes = 3;
  google.protobuf.Timestamp created = 4;
  // Containers using the image; -1 if Docker did not compute it.
  int64 containers = 5;
}

message DockerVolumeListRequest {}

message DockerVolumeListResult {
  // At most 1000 volumes.
  repeated DockerVolume volumes = 1;
  bool truncated = 2;
}

message DockerVolume {
  string name = 1;
  string driver = 2;
  string mountpoint = 3;
  // RFC 3339 as reported by Docker; may be empty.
  string created_at = 4;
}

message DockerNetworkListRequest {}

message DockerNetworkListResult {
  // At most 1000 networks.
  repeated DockerNetwork networks = 1;
  bool truncated = 2;
}

message DockerNetwork {
  string id = 1;
  string name = 2;
  string driver = 3;
  string scope = 4;
  bool internal = 5;
}

enum DockerPruneTarget {
  DOCKER_PRUNE_TARGET_UNSPECIFIED = 0;
  // Stopped containers (medium risk).
  DOCKER_PRUNE_TARGET_CONTAINERS = 1;
  // Dangling images, or all unused images with all_images (medium risk).
  DOCKER_PRUNE_TARGET_IMAGES = 2;
  // Unused networks (medium risk).
  DOCKER_PRUNE_TARGET_NETWORKS = 3;
  // Unused anonymous volumes, or all unused volumes with all_volumes (critical risk:
  // volumes hold data).
  DOCKER_PRUNE_TARGET_VOLUMES = 4;
  // Build cache (medium risk).
  DOCKER_PRUNE_TARGET_BUILD_CACHE = 5;
}

message DockerPruneRequest {
  DockerPruneTarget target = 1;
  // Images only: remove every image without a container, not only dangling ones.
  bool all_images = 2;
  // Volumes only: also remove named volumes (needs Docker API 1.42+).
  bool all_volumes = 3;
}

message DockerPruneResult {
  // IDs or names of what was removed; at most 500 are listed.
  repeated string deleted = 1;
  uint32 deleted_count = 2;
  uint64 space_reclaimed_bytes = 3;
}

// ---------------------------------------------------------------------------
// time.* (systemd-timedated over D-Bus). Status is read by the agent; changes run in
// the privileged helper.
// ---------------------------------------------------------------------------

message TimeStatusRequest {}

message TimeStatusResult {
  // IANA name, e.g. "Europe/Berlin" or "UTC".
  string timezone = 1;
  // The RTC is kept in local time instead of UTC (usually a misconfiguration).
  bool local_rtc = 2;
  // NTP synchronisation is enabled (systemd-timesyncd or chronyd).
  bool ntp_enabled = 3;
  // The clock is currently synchronised.
  bool ntp_synchronized = 4;
  // An NTP service is available to enable.
  bool can_ntp = 5;
  google.protobuf.Timestamp time = 6;
}

message TimeSetTimezoneRequest {
  // IANA name: letters, digits, "_", "-", "+", at most three "/"-separated parts,
  // at most 64 bytes, e.g. "America/Argentina/Buenos_Aires".
  string timezone = 1;
}

message TimeSetNTPRequest {
  bool enabled = 1;
}

// ---------------------------------------------------------------------------
// swap.* (read by the agent; changes in the privileged helper). The helper manages
// one swapfile at a fixed path, activated by a systemd swap unit so it survives
// reboots; other swap devices are reported but never changed.
// ---------------------------------------------------------------------------

message SwapStatusRequest {}

message SwapStatusResult {
  repeated SwapDevice devices = 1;
  // vm.swappiness, 0-200.
  uint32 swappiness = 2;
  // Path of the managed swapfile.
  string managed_path = 3;
  // Size of the managed swapfile; 0 if there is none.
  uint64 managed_size_bytes = 4;
  // The managed swapfile is in use.
  bool managed_active = 5;
}

message SwapDevice {
  string path = 1;
  // "file" or "partition".
  string type = 2;
  uint64 size_bytes = 3;
  uint64 used_bytes = 4;
  int32 priority = 5;
}

enum SwapOperation {
  SWAP_OPERATION_UNSPECIFIED = 0;
  // Create the managed swapfile (fails if it exists).
  SWAP_OPERATION_CREATE = 1;
  // Replace it with one of a new size (it is turned off first).
  SWAP_OPERATION_RESIZE = 2;
  // Turn it off and delete it.
  SWAP_OPERATION_REMOVE = 3;
}

message SwapConfigureRequest {
  SwapOperation operation = 1;
  // Create and resize: size in MiB, 64 to 65536.
  uint32 size_mib = 2;
}

message SwapSetSwappinessRequest {
  // 0-100. Persisted in /etc/sysctl.d and applied immediately.
  uint32 swappiness = 1;
}

// ---------------------------------------------------------------------------
// Privileged helper (sm-agent privd), served on a local UNIX socket only.
// ---------------------------------------------------------------------------

service PrivilegedService {
  // Execute runs a privileged action. The helper verifies the control plane's signature
  // itself, so a compromised unprivileged agent cannot invoke privileged actions.
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
}

message ExecuteRequest {
  Command command = 1;
}

message ExecuteResponse {
  CommandResult result = 1;
}
