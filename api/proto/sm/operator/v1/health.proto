syntax = "proto3";

package sm.operator.v1;

import "google/protobuf/timestamp.proto";

// HealthService reports whether the control plane is serving.
// It is the only operator endpoint that needs no authentication, so it
// deliberately returns no fleet or version information.
service HealthService {
  rpc Check(CheckRequest) returns (CheckResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message CheckRequest {}

message CheckResponse {
  ServingStatus status = 1;
  // Lets clients detect clock skew against the control plane.
  google.protobuf.Timestamp server_time = 2;
}

enum ServingStatus {
  SERVING_STATUS_UNSPECIFIED = 0;
  SERVING_STATUS_SERVING = 1;
  SERVING_STATUS_NOT_SERVING = 2;
}
